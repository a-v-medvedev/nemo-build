---
workload_name: eORCA025-spinup
binary-confs:
  - nemo.cpu.opt.openmp
  - nemo.cpu.opt.noopenmp

environment:
  - export NEMO_WORKLOAD_NAME=$WORKLOAD_NAME

scope:
  nnodes: [ 4:8:7 8:8:7 16:8:7 ]               # We fix LUMI parallel configuration here: 8 ranks x 7 threads 
  ntakes: 3

metrics:
   pattern: "^        .*: [0-9]+"              # Every timer from results.yaml will match
#  pattern: "(ice_dyn_adv_pra)|(ice_var)|(icedyn_adv)"

settings:
  run_under_profiler: false
  async_psubmit: false

general:
  build: |
         echo "---" > overrides.yaml
         echo "environment:" >> overrides.yaml
         echo "  - export NEMO_CODEBASE=\"DE340_LOCAL\"" >> overrides.yaml
         echo "  - export DNB_PACKAGE_VERSIONS=nemo:HEAD^$branch" >> overrides.yaml
         echo "  - export NEMO_WITH_GPU=$gpu" >> overrides.yaml
         echo "  - export NEMO_WITH_PROFILING=$prof" >> overrides.yaml
         echo "  - export NEMO_WITH_REPRODUCIBLE=$repro" >> overrides.yaml
         echo "  - export NEMO_WITH_FAKE_GPU=$fake" >> overrides.yaml
         echo "..." >> overrides.yaml

  run: |
       NSTEPS=100 

per-binary:
  nemo.cpu.opt.openmp:
    build: |
           branch="master"; gpu=0; fake=0; prof=0; repro=0;
    run: |
         true
 
  nemo.cpu.opt.noopenmp:
    build: |
           branch="master"; gpu=0; fake=0; prof=0; repro=0
    run: |
         _np=$(($np * $nt)); nt=1; np=$_np  # To make it run without OpenMP, set np=np*nt and then reset nt=1 (np will become 56)       

...
