<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>nvfortran Compiler Feedback Explorer</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-okaidia.min.css"
      rel="stylesheet"
    />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-core.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-fortran.min.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background-color: #272822;
        color: #f8f8f2;
        font-family: "Consolas", "Monaco", monospace;
        font-size: 14px;
      }
      .container {
        display: flex;
        flex-direction: column;
        height: 100vh;
      }
      .controls {
        padding: 10px;
        background-color: #333;
        border-bottom: 1px solid #444;
        flex-shrink: 0;
        display: flex;
        gap: 15px;
        align-items: center;
      }
      .controls label {
        margin-right: 5px;
      }
      .panels-container {
        display: flex;
        flex-grow: 1;
        height: calc(100% - 50px);
        overflow: hidden;
      }
      .panel {
        width: 50%;
        height: 100%;
        padding: 1em;
        box-sizing: border-box;
        overflow-y: scroll;
        scroll-behavior: smooth;
        border-left: 1px solid #444;
      }
      #fortranPanel {
        border-left: none;
      }
      #statusMessage {
        font-style: italic;
        color: #aaa;
        text-align: center;
      }
      .highlight {
        background-color: red;
        cursor: help;
      }

      .line {
        display: block;
        padding: 1px 6px;
        line-height: 1.4;
        min-height: 1.4em;
        white-space: pre;
      }
      #fortranPanel .line {
        white-space: pre;
      }
      #compilerPanel .line {
        white-space: pre;
        font-family: "Consolas", "Monaco", monospace;
        cursor: pointer;
      }
      .highlight-fortran {
        background-color: rgba(230, 219, 116, 0.3) !important;
        outline: 1px solid rgba(230, 219, 116, 0.5);
      }
      .highlight-compiler {
        background-color: rgba(174, 129, 255, 0.3) !important;
        outline: 1px solid rgba(174, 129, 255, 0.5);
      }
      .hover-highlight {
        background-color: rgba(102, 217, 239, 0.2) !important;
      }
      .fortran-line-container {
        display: flex;
        position: relative;
      }
      .fortran-linenum {
        width: 45px;
        text-align: right;
        padding-right: 1em;
        color: #888;
        user-select: none;
        flex-shrink: 0;
      }
      .fortran-code {
        flex-grow: 1;
      }
      pre[class*="language-"] {
        margin: 0;
        padding: 0;
        background: none;
        overflow: visible;
      }
      code[class*="language-"] {
        font-family: inherit;
        font-size: inherit;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="controls">
        <label for="fortranFile">Fortran Source:</label>
        <input type="file" id="fortranFile" accept=".f,.f90,.f95,.f03,.f08" />

        <label for="compilerFile">Compiler Output:</label>
        <input type="file" id="compilerFile" accept=".log,.txt,.out" />
        <div id="statusMessage">
          Please select Fortran source and compiler output files.
        </div>
      </div>
      <div class="panels-container">
        <div class="panel" id="fortranPanel"></div>
        <div class="panel" id="compilerPanel"></div>
      </div>
    </div>

    <script>
      const fortranPanel = document.getElementById("fortranPanel");
      const compilerPanel = document.getElementById("compilerPanel");
      const fortranFileInput = document.getElementById("fortranFile");
      const compilerFileInput = document.getElementById("compilerFile");
      const statusMessage = document.getElementById("statusMessage");

      let fortranLines = [];
      let compilerEntries = [];
      let fortranFileContent = null;
      let compilerFileContent = null;

      function readFile(file) {
        return new Promise((resolve, reject) => {
          if (!file) {
            reject(new Error("No file provided."));
            return;
          }
          const reader = new FileReader();
          reader.onload = (event) => {
            resolve(event.target.result);
          };
          reader.onerror = (event) => {
            console.error("File reading error:", event.target.error);
            reject(
              new Error(
                `Error reading file ${file.name}: ${event.target.error}`,
              ),
            );
          };
          reader.readAsText(file);
        });
      }

      async function handleFileSelection() {
        const fortranFile = fortranFileInput.files[0];
        const compilerFile = compilerFileInput.files[0];

        if (!fortranFile || !compilerFile) {
          if (statusMessage)
            statusMessage.textContent =
              "Waiting for both files to be selected...";

          fortranPanel.innerHTML = "";
          compilerPanel.innerHTML = "";
          fortranFileContent = null;
          compilerFileContent = null;
          return;
        }

        if (statusMessage) statusMessage.textContent = "Reading files...";

        try {
          const [fortranContent, compilerContent] = await Promise.all([
            readFile(fortranFile),
            readFile(compilerFile),
          ]);

          fortranFileContent = fortranContent;
          compilerFileContent = compilerContent;

          if (fortranFileContent && compilerFileContent) {
            if (statusMessage) statusMessage.remove();
            processAndRenderData(fortranFileContent, compilerFileContent);
          }
        } catch (error) {
          console.error("Error processing files:", error);
          fortranPanel.innerHTML = `<div style="color: red; padding: 1em;">Error: ${error.message}</div>`;
          compilerPanel.innerHTML = "";
          fortranFileContent = null;
          compilerFileContent = null;
        }
      }

      fortranFileContent = `{{inputCode}}`;
      compilerFileContent = `{{compilerLog}}`;
      processAndRenderData(fortranFileContent, compilerFileContent);

      function processAndRenderData(fortranText, compilerText) {
        fortranLines = fortranText.split("\n");
        compilerEntries = parseCompilerOutput(compilerText);

        renderFortranPanel(fortranLines);
        renderCompilerPanel(compilerEntries);
      }

      function parseCompilerOutput(rawOutput) {
        const entries = [];
        const lines = rawOutput.trim().split("\n");
        let currentLineNum = null;
        lines.forEach((line) => {
          const match = line.match(/^\s*(\d+),?\s*(.*)/);
          const trimmedLine = line.trimStart();
          if (match) {
            currentLineNum = parseInt(match[1], 10);
            entries.push({ line: currentLineNum, text: trimmedLine });
          } else if (currentLineNum !== null && trimmedLine.length > 0) {
            entries.push({ line: currentLineNum, text: line });
          } else if (trimmedLine.length > 0) {
            entries.push({ line: null, text: line });
          }
        });
        return entries;
      }

      function renderFortranPanel(lines) {
        fortranPanel.innerHTML = "";
        const fragment = document.createDocumentFragment();
        lines.forEach((lineContent, index) => {
          const lineNum = index + 1;
          const container = document.createElement("div");
          container.className = "fortran-line-container line";
          container.dataset.line = index;
          const numSpan = document.createElement("span");
          numSpan.className = "fortran-linenum";
          numSpan.textContent = lineNum;
          const codeWrapper = document.createElement("pre");
          codeWrapper.className = "fortran-code";
          const codeElement = document.createElement("code");
          codeElement.className = "language-fortran";
          codeElement.textContent = lineContent;
          codeWrapper.appendChild(codeElement);
          container.appendChild(numSpan);
          container.appendChild(codeWrapper);
          fragment.appendChild(container);

          container.addEventListener("click", () => {
            clearHighlights();
            highlightCompilerLines(index, false, container);
            scrollToCompilerLine(index);
          });
          container.addEventListener("mouseover", () => {
            clearHighlights("hover-only");
            highlightCompilerLines(index, true, container);
          });
          container.addEventListener("mouseout", () => {
            clearHighlights("hover-only");
            container.style.cursor = "default";
          });

          Prism.highlightElement(codeElement);
        });
        fortranPanel.appendChild(fragment);
      }

      function renderCompilerPanel(entries) {
        compilerPanel.innerHTML = "";
        const fragment = document.createDocumentFragment();
        entries.forEach(({ line, text }, entryIndex) => {
          const lineElement = document.createElement("div");
          lineElement.className = "line compiler-line";
          lineElement.textContent = text;
          lineElement.dataset.entryIndex = entryIndex;
          if (line !== null) {
            const lineIndex = line - 1;
            lineElement.dataset.line = lineIndex;

            lineElement.addEventListener("mouseover", () => {
              clearHighlights("hover-only");
              highlightFortranLine(lineIndex, true);
            });
            lineElement.addEventListener("mouseout", () => {
              clearHighlights("hover-only");
            });
            lineElement.addEventListener("click", () => {
              clearHighlights();
              highlightFortranLine(lineIndex);
              scrollToFortranLine(lineIndex);
              lineElement.classList.add("highlight-compiler");
            });
          } /*else { lineElement.style.cursor = 'default'; }*/
          fragment.appendChild(lineElement);
        });
        compilerPanel.appendChild(fragment);
      }

      function clearHighlights(type = "all") {
        const fortranSelector =
          type === "all"
            ? ".highlight-fortran, .hover-highlight"
            : ".hover-highlight";
        const compilerSelector =
          type === "all"
            ? ".highlight-compiler, .hover-highlight"
            : ".hover-highlight";

        if (type === "all") {
          document
            .querySelectorAll(`#fortranPanel ${fortranSelector}`)
            .forEach((el) =>
              el.classList.remove("highlight-fortran", "hover-highlight"),
            );
          document
            .querySelectorAll(`#compilerPanel ${compilerSelector}`)
            .forEach((el) =>
              el.classList.remove("highlight-compiler", "hover-highlight"),
            );
        } else {
          document
            .querySelectorAll(`#fortranPanel ${fortranSelector}`)
            .forEach((el) => el.classList.remove("hover-highlight"));
          document
            .querySelectorAll(`#compilerPanel ${compilerSelector}`)
            .forEach((el) => el.classList.remove("hover-highlight"));
        }
      }
      function highlightFortranLine(index, isHover = false) {
        const targetLine = fortranPanel.querySelector(
          `.line[data-line='${index}']`,
        );
        if (targetLine) {
          targetLine.classList.add(
            isHover ? "hover-highlight" : "highlight-fortran",
          );
        }
      }
      function highlightCompilerLines(
        fortranIndex,
        isHover = false,
        thisElement = null,
      ) {
        const targetLines = compilerPanel.querySelectorAll(
          `.line[data-line='${fortranIndex}']`,
        );
        targetLines.forEach((line) => {
          line.classList.add(
            isHover ? "hover-highlight" : "highlight-compiler",
          );
          if (thisElement !== null) {
            thisElement.style.cursor = "pointer";
            if (!isHover) {
              thisElement.classList.add("highlight-fortran");
            }
          }
        });
      }

      function scrollElementIntoView(element, container) {
        if (!element) return;
        const containerRect = container.getBoundingClientRect();
        const elementRect = element.getBoundingClientRect();
        const scrollTop =
          container.scrollTop +
          elementRect.top -
          containerRect.top -
          containerRect.height / 2 +
          elementRect.height / 2;
        container.scrollTo({ top: scrollTop, behavior: "smooth" });
      }
      function scrollToFortranLine(index) {
        const lineElement = fortranPanel.querySelector(
          `.line[data-line='${index}']`,
        );
        scrollElementIntoView(lineElement, fortranPanel);
      }
      function scrollToCompilerLine(fortranIndex) {
        const lineElement = compilerPanel.querySelector(
          `.line[data-line='${fortranIndex}']`,
        );
        scrollElementIntoView(lineElement, compilerPanel);
      }

      fortranFileInput.addEventListener("change", handleFileSelection);
      compilerFileInput.addEventListener("change", handleFileSelection);

      compilerPanel.querySelectorAll(".line").forEach((line) => {
        let processed = false;

        line.addEventListener("mouseenter", () => {
          if (processed) return;
          processed = true;

          const originalText = line.textContent;
          const tokens = originalText.match(/(\s+|[^\s]+)/g); // match words and whitespace
          line.innerHTML = "";

          let firstWordFound = false;

          tokens.forEach((token) => {
            if (/^\s+$/.test(token)) {
              // just spaces
              const span = document.createElement("span");
              span.textContent = token;
              line.appendChild(span);
            } else {
              // if token has commas, split further
              const subTokens = token.split(/(?<=\d),(?=\d)/g); // split on commas between digits
              subTokens.forEach((subToken, idx) => {
                const span = document.createElement("span");
                span.textContent = subToken;

                const cleaned = subToken.replace(/[^\d]/g, "");
                const isNumber = /^\d+$/.test(cleaned);
                const containsParentheses = /[()]/.test(subToken);
                const containsLetters = /[a-zA-Z]/.test(subToken);

                if (!firstWordFound && isNumber) {
                  // it's the first number word → skip
                  firstWordFound = true;
                } else if (
                  isNumber &&
                  !containsParentheses &&
                  !containsLetters
                ) {
                  span.addEventListener("mouseenter", () => {
                    span.classList.add("highlight");
                  });
                  span.addEventListener("mouseleave", () => {
                    span.classList.remove("highlight");
                  });
                  span.addEventListener("dblclick", () => {
                    clearHighlights();
                    highlightFortranLine(cleaned - 1);
                    scrollToFortranLine(cleaned - 1);
                    lineElement.classList.add("highlight-compiler");
                  });
                }

                line.appendChild(span);

                // re-add comma if this was a split token
                if (idx < subTokens.length - 1) {
                  const comma = document.createElement("span");
                  comma.textContent = ",";
                  line.appendChild(comma);
                }
              });
            }
          });
        });
      });
    </script>
  </body>
</html>
